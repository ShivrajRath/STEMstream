<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Old televisions ignore `width=device-width`: their browsers lay out at a
      // phone-sized viewport (typically 480-960 CSS px on a 1080p panel), so the
      // page collapses into a single oversized column. Pinning a 1280 px layout
      // width makes those browsers lay out like a TV and scale the result to the
      // panel. This must run before the first layout, hence an inline script.
      // Keep the pattern in sync with TV_USER_AGENT_PATTERN in src/lib/tv.js.
      (function () {
        var ua = navigator.userAgent || '';
        var isTv =
          /(smart-?tv|smarttv|hbbtv|netcast|webos|web0s|tizen|viera|bravia|aquos|googletv|google tv|android tv|appletv|apple tv|roku|crkey|firetv|fire tv|aft[a-z0-9]{1,3}\b|nettv|opera tv|philipstv|hisense)/i.test(
            ua,
          );
        if (!isTv) return;

        var screenWidth = window.screen ? window.screen.width : 0;
        // A panel that already reports a TV-sized viewport does not need help.
        if (!screenWidth || screenWidth >= 1000) return;

        var viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) viewport.setAttribute('content', 'width=1280');
      })();
    </script>
    <meta name="theme-color" content="#08090a" />
    <meta name="color-scheme" content="dark" />

    <title>STEMStream — Curated science, space, math & engineering videos</title>
    <meta
      name="description"
      content="A hand-picked, ad-free-feeling library of the best science, space, engineering, biology, emerging technology and math videos on YouTube. Curated by humans, played inline."
    />
    <meta name="author" content="STEMStream" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="STEMStream — Feed your curiosity" />
    <meta
      property="og:description"
      content="The internet's best STEM videos, chosen by hand and organised by idea — not by channel or algorithm."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Grotesk:wght@500..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: system-ui, sans-serif; color: #f1f1f1; background: #08090a; min-height: 100vh;">
        <h1 style="font-size: 1.5rem; margin-bottom: 0.75rem;">STEMStream needs JavaScript</h1>
        <p style="color: #a1a1aa;">This is a client-rendered React app. Please enable JavaScript to browse the collection.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
